  <!-- svans (seal) -->
  <path d="M86 92 Q110 84 101 58" stroke="#a98a6f" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M90 96 Q104 90 100 74" stroke="#fdfbf7" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- kropp -->
  <ellipse cx="60" cy="88" rx="29" ry="25" fill="#fdfbf7"/>
  <!-- ljusbrun "sadel" på ryggen -->
  <path d="M60 66 q26 2 28 20 q-14 6 -28 4 z" fill="#cdb295" opacity="0.85"/>
  <ellipse cx="60" cy="86" rx="18" ry="19" fill="#ffffff"/>
  <!-- ben -->
  <ellipse cx="48" cy="108" rx="8" ry="6" fill="#fdfbf7"/>
  <ellipse cx="72" cy="108" rx="8" ry="6" fill="#fdfbf7"/>
  <!-- öron (rundade, ovanpå huvudet) -->
  <path d="M27 36 Q29 9 41 7 Q52 11 55 33 Q41 29 27 36 Z" fill="#8a6a52"/>
  <path d="M93 36 Q91 9 79 7 Q68 11 65 33 Q79 29 93 36 Z" fill="#8a6a52"/>
  <path d="M35 31 Q37 16 42 15 Q48 18 49 31 Q42 28 35 31 Z" fill="#e9a9bd"/>
  <path d="M85 31 Q83 16 78 15 Q72 18 71 31 Q78 28 85 31 Z" fill="#e9a9bd"/>
  <!-- huvud -->
  <circle cx="60" cy="50" r="32" fill="#fdfbf7"/>
  <!-- brun mask runt ögonen, vit bläs i mitten -->
  <ellipse cx="44" cy="45" rx="13.5" ry="14" fill="#9a7a60"/>
  <ellipse cx="76" cy="45" rx="13.5" ry="14" fill="#9a7a60"/>
  <!-- ögon (blå) -->
  <ellipse cx="47" cy="49" rx="8" ry="8.5" fill="#fff"/>
  <ellipse cx="73" cy="49" rx="8" ry="8.5" fill="#fff"/>
  <circle cx="47" cy="50" r="5.6" fill="#4a90d9"/>
  <circle cx="73" cy="50" r="5.6" fill="#4a90d9"/>
  <circle cx="47" cy="50" r="2.7" fill="#16222e"/>
  <circle cx="73" cy="50" r="2.7" fill="#16222e"/>
  <circle cx="49" cy="47.5" r="1.6" fill="#fff"/>
  <circle cx="75" cy="47.5" r="1.6" fill="#fff"/>
  <!-- nos + mun -->
  <path d="M56 61 L64 61 L60 66 Z" fill="#e98aa0"/>
  <path d="M60 66 Q54 71 50 67 M60 66 Q66 71 70 67" stroke="#7a6253" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- morrhår -->
  <path d="M40 61 L23 57 M40 65 L23 68 M80 61 L97 57 M80 65 L97 68" stroke="#cfc3b5" stroke-width="1.5" stroke-linecap="round"/>
</svg>
